<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00D4FF" />
    <title>Runner Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1b2a;
        color: #e6f7ff;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        text-align: center;
      }
      .card {
        border: 1px solid rgba(0, 212, 255, 0.25);
        background: rgba(13, 27, 42, 0.8);
        padding: 32px;
        border-radius: 24px;
        max-width: 320px;
        box-shadow: 0 0 24px rgba(0, 212, 255, 0.2);
      }
      .title {
        font-size: 20px;
        margin: 0 0 12px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #00d4ff;
      }
      .subtitle {
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(230, 247, 255, 0.6);
      }
      .tip {
        margin-top: 16px;
        font-size: 14px;
        color: rgba(230, 247, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="title">Runner</p>
      <p class="subtitle">Offline Mode</p>
      <p class="tip">Reconnect to sync live runs, captures, and room updates.</p>
    </div>
  </body>
</html>
